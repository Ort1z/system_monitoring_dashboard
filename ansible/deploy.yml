---
- name: Deploy System Monitoring Dashboard
  hosts: production
  become: yes
  vars:
    app_dir: /opt/system-monitor
    docker_compose_version: "1.29.2"
    
  tasks:
    - name: Install dependencies
      apt:
        name: "{{ item }}"
        state: present
        update_cache: yes
      loop:
        - docker.io
        - docker-compose
        - python3-pip
        - git
        
    - name: Ensure Docker group exists
      group:
        name: docker
        state: present
        
    - name: Add user to Docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes
        
    - name: Clone repository
      git:
        repo: "https://github.com/your-repo/system-monitor.git"
        dest: "{{ app_dir }}"
        version: main
        force: yes
        
    - name: Create .env file
      template:
        src: templates/env.j2
        dest: "{{ app_dir }}/.env"
        
    - name: Start containers
      docker_compose:
        project_src: "{{ app_dir }}"
        state: present
        restarted: yes
        pull: yes
        
    - name: Ensure services are running
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - docker
        - prometheus
        - grafana